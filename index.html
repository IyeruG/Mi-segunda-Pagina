<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Ahorro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    .resultado {
      margin-top: 20px;
      padding: 10px;
      background-color: #e9ecef;
      border-radius: 5px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Calculadora de Ahorro</h2>

  <label for="meta">Monto de la meta ($):</label>
  <input type="number" id="meta" placeholder="Ej: 12000" min="1">

  <label for="meses">Plazo en meses:</label>
  <input type="number" id="meses" placeholder="Ej: 12" min="1">

  <button onclick="calcularAhorro()">Calcular Cuota Mensual</button>

  <div class="resultado" id="resultado">
    Ingresa los datos para calcular.
  </div>

  <script>
    function calcularAhorro() {
      const meta = parseFloat(document.getElementById('meta').value);
      const meses = parseInt(document.getElementById('meses').value);
      const resultado = document.getElementById('resultado');

      if (isNaN(meta) || isNaN(meses) || meta <= 0 || meses <= 0) {
        resultado.innerText = "Por favor ingresa números válidos.";
        return;
      }

      const ahorroMensual = meta / meses;
      resultado.innerText = `Debes ahorrar: $${ahorroMensual.toFixed(2)} al mes`;
    }
  </script>

</body>
</html>
